name: Contribution snake

on:
  schedule:
    # 04:00 UTC, an hour after the cards so the two never push at once
    - cron: "0 4 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-contribution-snake
    permissions:
      contents: write

    steps:
      - uses: Platane/snk/svg-only@v1
        with:
          github_user_name: ${{ github.repository_owner }}
          svg_out_path: dist/snake.svg

      - uses: Platane/snk/svg-only@v1
        with:
          github_user_name: ${{ github.repository_owner }}
          svg_out_path: dist/snake-dark.svg?palette=github-dark

      # Replaces the whole `output` branch from dist/ — this is why the summary
      # cards live on `cards` instead.
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
