name: Contribution snake

on:
  schedule:
    # 04:00 UTC, an hour after the cards so the two never push at once
    - cron: "0 4 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-contribution-snake
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      # v3 is required. v1 accepts only github_user_name/svg_out_path with no
      # palette options, so a query string there became part of the filename
      # rather than producing a dark variant.
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?palette=github-light
            dist/snake-dark.svg?palette=github-dark

      - name: Publish snake to the output branch
        run: |
          set -euo pipefail

          test -s dist/snake.svg && test -s dist/snake-dark.svg || {
            echo "::error::expected both snake variants, got: $(ls -1 dist 2>/dev/null | tr '\n' ' ')"
            exit 1; }

          # Served from the branch root so the README URLs stay .../output/snake.svg
          mv dist/snake.svg dist/snake-dark.svg .

          git config user.name  "Ihsan-p1"
          git config user.email "207809612+Ihsan-p1@users.noreply.github.com"

          git checkout --orphan snake-publish
          git rm -rf --cached . > /dev/null
          git add -f snake.svg snake-dark.svg
          git commit -m "Update contribution snake"
          git push -f origin snake-publish:output
