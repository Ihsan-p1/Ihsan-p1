name: Profile summary cards

on:
  schedule:
    # 03:00 UTC = 10:00 WIB, daily
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-profile-summary-cards
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          # A PAT (scopes: read:user, public_repo) stored as a repo secret.
          # Falls back to the built-in token, which works but reports less
          # complete cross-repo totals because it cannot read user-level data.
          GITHUB_TOKEN: ${{ secrets.SUMMARY_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          UTC_OFFSET: 7
          THEME: "github_dark"
          ANIMATION: "load"
          # Publishing is handled by the next step instead. The action's own
          # AUTO_PUSH ignored BRANCH_NAME, committed straight to the checked-out
          # branch, and attributed the commit to a bot identity.
          AUTO_PUSH: false

      - name: Publish cards to the cards branch
        run: |
          set -euo pipefail

          # Fail loudly. The previous setup reported success while publishing
          # nothing, which is the worst possible outcome for a scheduled job.
          test -d profile-summary-card-output/github_dark || {
            echo "::error::no cards were generated"; exit 1; }

          git config user.name  "Ihsan-p1"
          git config user.email "207809612+Ihsan-p1@users.noreply.github.com"

          # Orphan branch, force-pushed: the cards branch holds only the current
          # cards and never accumulates a daily commit history.
          git checkout --orphan cards-publish
          git rm -rf --cached . > /dev/null
          git add -f profile-summary-card-output
          git commit -m "Update profile summary cards"
          git push -f origin cards-publish:cards
