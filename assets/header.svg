<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="1200" height="260" role="img" aria-label="Ihsan — Computer Vision, NLP, Edge AI">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4ECDC4"/>
      <stop offset="55%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4ECDC4" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#38BDF8" fill-opacity="0.09"/>
    </pattern>
  </defs>

  <rect width="1200" height="260" rx="16" fill="#0A0E1F"/>
  <rect width="1200" height="260" rx="16" fill="url(#dots)"/>
  <ellipse cx="1010" cy="46" rx="360" ry="220" fill="url(#glow)"/>

  <!-- left accent bar -->
  <rect x="48" y="66" width="5" height="128" rx="2.5" fill="url(#accent)"/>

  <!-- wordmark -->
  <text x="84" y="126" fill="#E2E8F0" font-family="'Segoe UI',Ubuntu,Helvetica,Arial,sans-serif"
        font-size="66" font-weight="700" letter-spacing="15">IHSAN</text>

  <rect x="86" y="148" width="210" height="2.5" rx="1.25" fill="url(#rule)"/>

  <text x="86" y="184" fill="#4ECDC4" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace"
        font-size="19" letter-spacing="4.2">COMPUTER VISION · NLP · EDGE AI</text>

  <text x="86" y="214" fill="#94A3B8" font-family="'Segoe UI',Ubuntu,Helvetica,Arial,sans-serif"
        font-size="15" letter-spacing="0.4">engineering hardware-software systems, then deploying them</text>

  <!-- edge/circuit motif -->
  <g stroke="#38BDF8" stroke-opacity="0.22" stroke-width="1.6" fill="none" stroke-linecap="round">
    <path d="M912 206 h48 v-30 h40"/>
    <path d="M912 226 h74 v-22 h30"/>
    <path d="M1040 176 h34"/>
  </g>
  <g fill="#4ECDC4" fill-opacity="0.5">
    <circle cx="1074" cy="176" r="3"/>
    <circle cx="1016" cy="204" r="3"/>
  </g>

  <!-- three diamonds -->
  <g transform="translate(1052 104)">
    <rect x="-9" y="-9" width="18" height="18" rx="2.5" transform="rotate(45)" fill="#4ECDC4">
      <animate attributeName="opacity" values="1;0.28;1" dur="3.6s" begin="0s" repeatCount="indefinite"/>
    </rect>
    <rect x="27" y="-9" width="18" height="18" rx="2.5" transform="rotate(45 36 0)" fill="#38BDF8">
      <animate attributeName="opacity" values="1;0.28;1" dur="3.6s" begin="1.2s" repeatCount="indefinite"/>
    </rect>
    <rect x="63" y="-9" width="18" height="18" rx="2.5" transform="rotate(45 72 0)" fill="#A78BFA">
      <animate attributeName="opacity" values="1;0.28;1" dur="3.6s" begin="2.4s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
